server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Las fotos de los proyectos viajan en base64 dentro del JSON
  client_max_body_size 15m;

  # El backend de ColorLink corre en el mismo contenedor de red (Tailscale), puerto 3000
  location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 60s;
  }

  # Archivos con hash en el nombre: caché largo
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html nunca se cachea para que los cambios se vean al desplegar
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
